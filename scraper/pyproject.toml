[project]
name = "nvidia-radar-scraper"
version = "0.1.0"
description = "Scraper for NVIDIA Startup AI Radar project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "selectolax>=0.3.0",
    "trafilatura>=1.8.0",
    "playwright>=1.41.0",
    "tenacity>=8.2.0",
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg>=3.1.0",
    "psycopg[binary]>=3.1.0",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "fake-useragent>=1.4.0",
    "hashlib-tools>=1.0.0",
    " justext>=4.0.0",
    "readability-lxml>=0.8.0",
    "dateparser>=1.2.0",
    "regex>=2023.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
nvidia-scraper = "scraper.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "T10", "ISC"]
ignore = ["E501", "ISC001", "B007", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
