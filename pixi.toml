[project]
name = "academy-nvidia-radar"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
test = { cmd = "pytest tests/ rag_audit/ -q" }
test-rag = { cmd = "pytest rag_audit/test_rag_improvements.py -q -v" }
eval = { cmd = ".pixi/envs/default/bin/python -m rag.eval.run_eval" }
eval-local = { cmd = ".pixi/envs/default/bin/python -m rag.eval.eval_local" }
export-kb = { cmd = ".pixi/envs/default/bin/python -m rag.ingest.nvidia_kb --export" }
lint = { cmd = "ruff check agents/ api/ rag/ scraper/ scripts/" }
lint-fix = { cmd = "ruff check --fix agents/ api/ rag/ scraper/ scripts/" }

[dependencies]
python = "3.11.*"
fastapi = ">=0.141.1,<0.142"
uvicorn = ">=0.52.4,<0.53"
cohere = ">=7.1.0,<8"
pytest = ">=9.1.1,<10"
sentence-transformers = ">=3.0"
ruff = ">=0.6"

[pypi-dependencies]
httpx = ">=0.27"
beautifulsoup4 = ">=4.12"
lxml = ">=5"
selectolax = ">=0.3"
trafilatura = ">=1.8"
playwright = ">=1.41"
tenacity = ">=8.2"
loguru = ">=0.7"
pydantic = ">=2.5"
pydantic-settings = ">=2.1"
sqlalchemy = ">=2.0"
psycopg = {version = ">=3.1", extras = ["binary"]}
asyncpg = ">=0.29"
python-dotenv = ">=1.0"
tqdm = ">=4.66"
fake-useragent = ">=1.4"
dateparser = ">=1.2"
regex = ">=2023"
qdrant-client = ">=1.18"
rank-bm25 = ">=0.2.2"
langgraph = ">=0.2"
langchain = ">=0.3"
langchain-openai = ">=0.2"
langchain-core = ">=0.3"
numpy = ">=1.26"
openai = ">=1.0"
sentence-transformers = ">=3.0"
torch = ">=2.0"
